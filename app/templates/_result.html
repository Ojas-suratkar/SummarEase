{% if error %}
  <div class="alert alert-danger mt-4">{{ error }}</div>
{% endif %}

{% if summary %}
  <div class="card mt-4 shadow-sm">
    <div class="card-body">
      <h5 class="card-title d-flex justify-content-between align-items-center">
        Summary
        <button type="button" class="btn btn-sm btn-outline-secondary speak-btn" data-text="{{ summary }}">
          🔊 Listen
        </button>
      </h5>
      <p class="card-text">{{ summary }}</p>
      <audio class="w-100 mt-2 d-none" controls></audio>

      {% if keywords %}
        <hr>
        <h6>Keywords</h6>
        <div class="d-flex flex-wrap gap-2">
          {% for kw in keywords %}
            <button type="button" class="btn btn-sm btn-outline-primary explain-btn" data-term="{{ kw }}">
              {{ kw }}
            </button>
          {% endfor %}
        </div>
        <div class="explain-output mt-2 small text-muted"></div>
      {% endif %}
    </div>
  </div>
{% endif %}
