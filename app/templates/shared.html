<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if entry %}{{ entry.source_ref or entry.source_type }} -- SummarEase{% else %}Not found -- SummarEase{% endif %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar navbar-dark se-navbar mb-4">
    <div class="container">
      <span class="navbar-brand fw-bold d-flex align-items-center gap-2">
        <span class="se-brand-mark">S</span> SummarEase
      </span>
      <span class="badge se-kb-badge">shared, read-only</span>
    </div>
  </nav>
  <main class="container pb-5" style="max-width: 720px;">
    {% if entry %}
      <div class="card shadow-sm">
        <div class="card-body">
          <span class="badge text-bg-secondary text-uppercase mb-2">{{ entry.source_type }}</span>
          <h4 class="card-title">{{ entry.source_ref or "Untitled" }}</h4>
          <p class="card-text">{{ entry.summary }}</p>
          <p class="text-muted small mb-0">Shared from SummarEase &middot; {{ entry.created_at[:10] }}</p>
        </div>
      </div>
    {% else %}
      <div class="card shadow-sm">
        <div class="card-body text-center py-5">
          <p class="mb-0 text-muted">This link doesn't point to anything (it may have been revoked).</p>
        </div>
      </div>
    {% endif %}
  </main>
</body>
</html>
